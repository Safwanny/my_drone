# ROS 2 <-> Gazebo topic bridge for build03.
#
# Note the asymmetry in naming: Gazebo's MulticopterVelocityControl plugin
# expects a gz.msgs.Twist on <robotNamespace>/<commandSubTopic>, which is
# why the ROS side's friendly /cmd_vel maps onto the longer gz name.

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/build03/gazebo/command/twist"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/enable"
  gz_topic_name: "/build03/enable"
  ros_type_name: "std_msgs/msg/Bool"
  gz_type_name: "gz.msgs.Boolean"
  direction: ROS_TO_GZ

# Rotor speeds (rad/s) from our flight_controller to the four
# MulticopterMotorModel plugins, indexed by motorNumber. The gz topic is the
# one PX4 writes (/<model>/command/motor_speed). Unused (no publisher) with
# controller:=gz or px4.
- ros_topic_name: "/motor_speed"
  gz_topic_name: "/build03/command/motor_speed"
  ros_type_name: "actuator_msgs/msg/Actuators"
  gz_type_name: "gz.msgs.Actuators"
  direction: ROS_TO_GZ

# Sensors, from their default gz topics (the names PX4 also reads).
- ros_topic_name: "/imu"
  gz_topic_name: "/world/empty_flight/model/build03/link/base_link/sensor/imu_sensor/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/air_pressure"
  gz_topic_name: "/world/empty_flight/model/build03/link/base_link/sensor/air_pressure_sensor/air_pressure"
  ros_type_name: "sensor_msgs/msg/FluidPressure"
  gz_type_name: "gz.msgs.FluidPressure"
  direction: GZ_TO_ROS

# Gazebo Harmonic reports the field in gauss, not the tesla
# sensor_msgs/MagneticField specifies (PX4's bridge expects gauss).
- ros_topic_name: "/magnetic_field"
  gz_topic_name: "/world/empty_flight/model/build03/link/base_link/sensor/magnetometer_sensor/magnetometer"
  ros_type_name: "sensor_msgs/msg/MagneticField"
  gz_type_name: "gz.msgs.Magnetometer"
  direction: GZ_TO_ROS

- ros_topic_name: "/navsat"
  gz_topic_name: "/world/empty_flight/model/build03/link/base_link/sensor/navsat_sensor/navsat"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

# The exact state from gz. /ground_truth/odom is for scoring and debugging
# only. /odom is the state the flight stack flies on: also the exact state
# while our controller runs on it, an estimator's output later.
- ros_topic_name: "/ground_truth/odom"
  gz_topic_name: "/model/build03/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/odom"
  gz_topic_name: "/model/build03/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/model/build03/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Gazebo namespaces the clock per-world when anything else already
# publishes on /clock, so the world name has to appear here. If you load a
# different world, update this line to match.
- ros_topic_name: "/clock"
  gz_topic_name: "/world/empty_flight/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Rotor joint angles, so robot_state_publisher can place (and spin) the
# props in RViz.
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/empty_flight/model/build03/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
