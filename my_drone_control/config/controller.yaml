# Gains and limits for flight_controller, in physical units. The node
# multiplies by mass / inertia read from the URDF, so gains survive a mass
# change. Vector entries are [x, y, z] (z = yaw for the attitude/rate loops).
#
# Tuning order, inner to outer: rate -> attitude -> velocity -> position.
# Each outer loop should be ~3-5x slower than the one inside it.
flight_controller:
  ros__parameters:
    # Position loop: P only. Velocity setpoint = pos_p * error, saturated.
    pos_p: [1.0, 1.0, 1.0]          # (m/s) per m
    vel_max_xy: 3.0                 # m/s
    vel_max_up: 2.0
    vel_max_down: 1.0

    # Velocity loop: PID -> acceleration setpoint. D acts on measured accel.
    vel_p: [2.0, 2.0, 4.0]          # (m/s^2) per (m/s)
    vel_i: [0.4, 0.4, 1.0]
    vel_d: [0.1, 0.1, 0.0]
    vel_i_max: [2.0, 2.0, 3.0]      # m/s^2

    # Acceleration -> thrust vector.
    tilt_max_deg: 35.0
    thrust_max_fraction: 0.8        # of full thrust, rest kept for attitude

    # Attitude loop: quaternion P -> body-rate setpoint.
    att_p: [6.0, 6.0, 3.0]          # (rad/s) per rad
    rate_max: [3.0, 3.0, 2.0]       # rad/s

    # Rate loop: PID -> angular acceleration, times inertia -> torque.
    rate_p: [18.0, 18.0, 8.0]       # (rad/s^2) per (rad/s)
    rate_i: [4.0, 4.0, 2.0]
    rate_d: [0.05, 0.05, 0.0]
    rate_i_max: [2.0, 2.0, 1.0]     # rad/s^2

    idle_fraction: 0.10             # armed rotor speed, fraction of max
    default_goal_alt: 1.5           # m, for a z=0 goal before take-off
    alt_max: 30.0                   # m, goals above (or below 0) are rejected
    land_speed: 0.3                 # m/s descent below land_slow_alt (vel_max_down above)
    land_slow_alt: 0.6              # m, touchdown is only detected below this
    cmd_vel_timeout: 0.5            # s without /cmd_vel -> hold position
    odom_timeout: 0.2               # s without /odom -> level descent
